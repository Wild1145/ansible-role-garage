- name: Template garage config file
  ansible.builtin.template:
    src: garage.conf.j2
    dest: "/etc/garage.toml"
    mode: '0600'
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
  notify: Restart garage

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Get node id
  ansible.builtin.shell: |
    garage node id -q
  changed_when: false
  register: garage_node_id
  executable: /bin/bash

- name: Save garage node id
  ansible.builtin.set_fact:
    garage_node_id: "{{ garage_node_id.stdout }}"

- name: Loop connect garage nodes
  ansible.builtin.shell:
    cmd: "garage node connect {{ hostvars[item]['garage_node_id'] }}"
  loop: "{{ ansible_play_hosts | reject('equalto', inventory_hostname) }}"
  delegate_to: "{{ ansible_play_hosts[0] }}"
  changed_when: false
  run_once: true
  when: ansible_play_hosts | length > 1
  executable: /bin/bash

- name: Assign layout (Storage Nodes)
  ansible.builtin.shell:
    cmd: "garage layout assign {{ garage_node_id.split('@')[0] }} -z {{ garage_zone_name }} -c {{ garage_node_capacity }}"
  changed_when: false
  delegate_to: "{{ ansible_play_hosts[0] }}"
  when: garage_gateway_node = false
  executable: /bin/bash

- name: Assign layout (Gateway Nodes)
  ansible.builtin.shell:
    cmd: "garage layout assign --gateway {{ garage_node_id.split('@')[0] }} -z {{ garage_zone_name }}"
  changed_when: false
  delegate_to: "{{ ansible_play_hosts[0] }}"
  when: garage_gateway_node = true
  executable: /bin/bash

- name: Get current layout verion number
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v1/layout"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
  register: layout_info

- name: Set layout version
  ansible.builtin.set_fact:
    new_layout_version: "{{ layout_info.json.version | int + 1 }}"
  run_once: true
  delegate_to: "{{ ansible_play_hosts[0] }}"

- name: Apply Layout
  ansible.builtin.shell: "garage layout apply --version {{ new_layout_version }}"
  changed_when: false
  run_once: true
  delegate_to: "{{ ansible_play_hosts[0] }}"
  executable: /bin/bash
