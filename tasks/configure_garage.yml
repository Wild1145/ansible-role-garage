- name: Loop connect garage nodes
  ansible.builtin.command:
    cmd: "garage node connect {{ hostvars[item]['garage_node_id'] }}"
  loop: "{{ ansible_play_hosts | reject('equalto', inventory_hostname) }}"
  delegate_to: "{{ ansible_play_hosts[0] }}"
  changed_when: false
  run_once: true
  when: ansible_play_hosts | length > 1

- name: Assign layout
  ansible.builtin.command:
    cmd: "garage layout assign {{ garage_node_id.split('@')[0] }} -z {{ garage_zone_name }} -c {{ garage_node_capacity }}"
  changed_when: false
  delegate_to: "{{ ansible_play_hosts[0] }}"

- name: Get current layout verion number
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v1/layout"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
  register: layout_info

- name: Set layout version
  ansible.builtin.set_fact:
    new_layout_version: "{{ layout_info.json.version | int + 1 }}"
  run_once: true
  delegate_to: "{{ ansible_play_hosts[0] }}"

- name: Apply Layout
  ansible.builtin.command: "garage layout apply --version {{ new_layout_version }}"
  changed_when: false
  run_once: true
  delegate_to: "{{ ansible_play_hosts[0] }}"
