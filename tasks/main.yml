- name: Don't allow 2 node deployment
  ansible.builtin.assert:
    that: not ansible_play_hosts | length == 2
    msg: "A clustered Garage deployment requires at least 3 nodes."

- name: Configure firewall
  ansible.builtin.include_tasks:
    file: configure_firewall.yml
  when: ansible_os_family == 'RedHat'

- name: Check garage version
  ansible.builtin.include_tasks:
    file: check_garage_version.yml

- name: Configure Garage
  ansible.builtin.include_tasks:
    file: configure_garage.yml

- name: Install nginx
  ansible.builtin.include_tasks:
    file: nginx.yml
  when: garage_nginx_enabled

- name: Install keepalived
  ansible.builtin.import_role:
    name: evrardjp.keepalived
  when: garage_keepalived_enabled and ansible_play_hosts | length > 1
